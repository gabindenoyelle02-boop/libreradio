name: Build LibreRadio iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install XcodeGen
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate

      - name: Show Xcode information
        run: |
          xcodebuild -version
          xcodebuild -list

      - name: Build iOS application
        run: |
          xcodebuild \
            -scheme LibreRadio \
            -project LibreRadio.xcodeproj \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Check build output
        run: |
          echo "Contenu du dossier build :"
          find build -maxdepth 6 -type d -name "*.app" -print

      - name: Create IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/LibreRadio.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERREUR : LibreRadio.app introuvable"
            echo "Recherche complète :"
            find build -type d -name "*.app" -print
            exit 1
          fi

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/LibreRadio.app

          zip -r LibreRadio.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LibreRadio-iOS
          path: LibreRadio.ipa
